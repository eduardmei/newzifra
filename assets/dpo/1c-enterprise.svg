<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="c1" x1="70" y1="40" x2="580" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3ec7ff"/>
      <stop offset=".5" stop-color="#7a4dff"/>
      <stop offset="1" stop-color="#ff3d9a"/>
    </linearGradient>
    <linearGradient id="c2" x1="200" y1="90" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd45a"/>
      <stop offset="1" stop-color="#ff6b32"/>
    </linearGradient>
    <radialGradient id="cglow" cx="48%" cy="40%" r="58%">
      <stop stop-color="#3ec7ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" rx="28" fill="#0a0a12"/>
  <rect width="640" height="400" rx="28" fill="url(#cglow)"/>

  <!-- App window -->
  <rect x="78" y="58" width="484" height="292" rx="18" fill="#12121c" stroke="url(#c1)" stroke-width="2"/>

  <!-- Title bar -->
  <path d="M78 76c0-10 8-18 18-18h448c10 0 18 8 18 18v28H78V76Z" fill="url(#c1)" fill-opacity=".18"/>
  <circle cx="104" cy="90" r="5" fill="#ff3d9a"/>
  <circle cx="122" cy="90" r="5" fill="#ffd45a"/>
  <circle cx="140" cy="90" r="5" fill="#3ec7ff"/>

  <!-- 1C badge -->
  <rect x="450" y="72" width="88" height="36" rx="11" fill="url(#c2)" fill-opacity=".2" stroke="url(#c2)" stroke-width="1.7"/>
  <text x="494" y="90" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="18" fill="#f4ece4" letter-spacing="1">1C</text>

  <!-- Toolbar (1C-like command panel) -->
  <rect x="92" y="116" width="456" height="30" rx="8" fill="#1a1a28" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="102" y="123" width="38" height="16" rx="5" fill="#ffd45a" fill-opacity=".88"/>
  <rect x="148" y="123" width="38" height="16" rx="5" fill="#3ec7ff" fill-opacity=".32"/>
  <rect x="194" y="123" width="38" height="16" rx="5" fill="#7a4dff" fill-opacity=".32"/>
  <rect x="240" y="123" width="38" height="16" rx="5" fill="#ff3d9a" fill-opacity=".28"/>
  <rect x="292" y="123" width="140" height="16" rx="5" fill="#f4ece4" fill-opacity=".1"/>

  <!-- Left nav / metadata tree -->
  <rect x="92" y="158" width="132" height="176" rx="12" fill="#161622" stroke="url(#c1)" stroke-width="1.4" stroke-opacity=".55"/>
  <path d="M108 178h78" stroke="#ffd45a" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
  <path d="M118 200h82M118 222h68M128 244h74M118 266h80M128 288h60" stroke="#f4ece4" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="200" r="2.6" fill="#3ec7ff"/>
  <circle cx="110" cy="222" r="2.6" fill="#7a4dff"/>
  <circle cx="120" cy="244" r="2.6" fill="#ff3d9a"/>
  <circle cx="110" cy="266" r="2.6" fill="#ffd45a"/>

  <!-- Document form -->
  <rect x="236" y="158" width="312" height="86" rx="12" fill="#161622" stroke="url(#c1)" stroke-width="1.4" stroke-opacity=".5"/>
  <path d="M252 176h128M252 198h188M252 220h104" stroke="#f4ece4" stroke-opacity=".2" stroke-width="7" stroke-linecap="round"/>
  <rect x="460" y="170" width="70" height="24" rx="8" fill="#ffd45a"/>
  <path d="M474 182h42" stroke="#1c1714" stroke-width="4" stroke-linecap="round" opacity=".45"/>

  <!-- Journal / spreadsheet -->
  <rect x="236" y="256" width="312" height="78" rx="12" fill="#161622" stroke="url(#c1)" stroke-width="1.4" stroke-opacity=".5"/>
  <path d="M252 272h280M252 290h280M252 308h280" stroke="#f4ece4" stroke-opacity=".1" stroke-width="1"/>
  <path d="M312 256v78M392 256v78M472 256v78" stroke="#f4ece4" stroke-opacity=".1" stroke-width="1"/>
  <rect x="252" y="276" width="46" height="9" rx="3" fill="#3ec7ff" fill-opacity=".4"/>
  <rect x="322" y="294" width="52" height="9" rx="3" fill="#7a4dff" fill-opacity=".4"/>
  <rect x="402" y="312" width="44" height="9" rx="3" fill="#ff3d9a" fill-opacity=".35"/>
